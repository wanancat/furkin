# furkin mod metadata -- Forge 1.20.1
#
# MDK template tutorial comments removed on 2026-09-22; only live config kept.
#
# NOTE: keep this file pure ASCII. It is parsed by the Groovy template engine in
# processResources, which round-trips the text through the platform default charset
# and replaces non-ASCII characters with '?'. Placeholders are expanded at build time.

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Furkin (绒亲)"
authors="${mod_authors}"
description='''${mod_description}'''

# Dependencies: Forge itself + vanilla MC version range, both mandatory.
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
